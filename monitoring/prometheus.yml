# Prometheus configuration for ShopVerse monitoring
# Unit V: Monitoring and Observability

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Product Service (Spring Boot Actuator + Micrometer) ──
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['product-service:8080']
        labels:
          service: 'product-service'
          environment: 'local'

  # ── Cart Service (custom /metrics) ──
  - job_name: 'cart-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cart-service:8001']
        labels:
          service: 'cart-service'
          environment: 'local'

  # ── Prometheus self-monitoring ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
