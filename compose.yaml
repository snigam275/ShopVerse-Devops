services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopverse
      POSTGRES_USER: shopverse
      POSTGRES_PASSWORD: shopverse_dev
    command: ["postgres", "-c", "fsync=off"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse"]
      interval: 5s
      retries: 5

  product-service:
    build: ./product-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopverse
      SPRING_DATASOURCE_USERNAME: shopverse
      SPRING_DATASOURCE_PASSWORD: shopverse_dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      start_period: 30s
      retries: 5

  cart-service:
    build: ./cart-service
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8080
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3020:3000"
    depends_on:
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy

